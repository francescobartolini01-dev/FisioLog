<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="FisioLog">
  <style>
    .ring{stroke-dasharray:352.9 490.1;animation:fill 1.6s cubic-bezier(.3,.8,.2,1) both}
    .limb{transform-box:view-box;transform-origin:100px 118px;animation:bend 1.1s cubic-bezier(.2,1.3,.4,1) .35s both}
    .rom{animation:rom 4s ease-in-out 2s infinite}
    @keyframes fill{from{stroke-dasharray:0 490.1}}
    @keyframes bend{from{transform:rotate(34deg)}}
    @keyframes rom{0%,86%,100%{opacity:1}92%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.ring,.limb,.rom{animation:none}}
  </style>
  <circle cx="100" cy="100" r="92" fill="#0E2A47"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#7CC8EE" stroke-opacity=".22" stroke-width="9"/>
  <circle class="ring" cx="100" cy="100" r="78" fill="none" stroke="#7CC8EE" stroke-width="9" stroke-linecap="round" transform="rotate(-90 100 100)"/>
  <path d="M60 78 L100 118" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <g class="limb"><path d="M100 118 L140 92" stroke="#7CC8EE" stroke-width="16" stroke-linecap="round"/></g>
  <circle cx="100" cy="118" r="13" fill="#0E2A47" stroke="#FFFFFF" stroke-width="5"/>
  <path class="rom" d="M76 132 A34 34 0 0 0 128 138" fill="none" stroke="#7CC8EE" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
</svg>
